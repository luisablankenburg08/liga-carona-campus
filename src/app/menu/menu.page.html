<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Carona Campus</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="filtro-caronas">
    <ion-button fill="outline" (click)="abrirCaronasAnteriores()">Caronas Anteriores</ion-button>
  </div>
  <section class="filtro-caronas">
    <h2>{{ somenteHoje ? 'Saindo hoje' : 'Todas as próximas caronas' }}</h2>
    <div class="acoes-filtro">
      <ion-button fill="outline" (click)="alternarFiltro()">
        {{ somenteHoje ? 'Ver todas' : 'Saindo hoje' }}
      </ion-button>
    </div>
  </section>
  
  <div class="vaga">
    @for (carona of caronas; track carona.id) {
      <app-carona
        [carona]="carona"
        (adicionar)="adicionarCarona($event)"
      ></app-carona>
    } @empty {
      <p class="estado-vazio">Não há caronas disponíveis.</p>
    }
  </div>

  <div class="minhas-caronas">
    <ion-button (click)="abrirMinhasCaronas()">Minhas Caronas</ion-button>
  </div>
</ion-content>
