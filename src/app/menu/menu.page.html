<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Carona Campus</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button routerLink="/carona" style="--background: #0f766e;">Minhas Caronas</ion-button>
  
  <div class="vaga">
    <app-carona *ngFor="let carona of listacaronas" [carona]="carona" ></app-carona>
  </div>

    
</ion-content>
