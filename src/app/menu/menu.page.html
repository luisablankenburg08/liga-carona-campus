<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Carona Campus</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="vaga">
    <app-carona *ngFor="let carona of listacaronas" [carona]="carona" ></app-carona>
  </div>
    
  <ion-button routerLink="/minhas-caronas" class="btn-caronas">Minhas Caronas</ion-button>
</ion-content>
